        position: relative;

        overflow: hidden;                                                                                               
        background: #000;                                                                                               
      }                                                                                                                 
                                                                                                                        
      .video-wrap iframe {                                                                                              
        position: absolute;                                                                                             
        top: 0; left: 0;

        border: 0;

        margin: 50px 0 14px;

      .two-col {                                                                                                        
        display: grid;                                                                                                  
        grid-template-columns: 1fr 1fr;                                                                                 
        gap: 24px;                                                                                                      
        text-align: left;                                                                                               
      }                                                                                                                 
                                                                                                                        
      .video-card h3 {                                                                                                  
        font-size: 15px;                                                                                                
        font-weight: 700;

        .two-col { grid-template-columns: 1fr; }

        font-weight: 700;                                                                                               
        text-decoration: none;                                                                                          
        border-radius: 8px;                                                                                             
        letter-spacing: 0.5px;                                                                                          
        transition: background 0.2s;                                                                                    
      }                                                                                                                 
                                                                                                                        
      .btn-contact:hover { background: #e6ad00; }                                                                       
                                                                                                                        
      .links {
