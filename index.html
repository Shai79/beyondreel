<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeyondReel</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 span { color: #FFC107; }

    p.subtitle {
      font-size: 20px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
      margin: 50px 0 14px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      text-align: left;
    }

    .video-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin: 0 0 10px;
    }

    @media (max-width: 600px) {
      .two-col { grid-template-columns: 1fr; }
      h1 { font-size: 34px; }
    }

    .btn-contact {
      display: inline-block;
      margin-top: 48px;
      padding: 14px 40px;
      background: #FFC107;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .btn-contact:hover { background: #e6ad00; }

    .links {
      margin-top: 20px;
    }

    .links a {
      color: #888;
      text-decoration: none;
      margin: 0 10px;
      font-size: 15px;
    }

    .links a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="container">

    <h1>Beyond<span>Reel</span></h1>
    <p class="subtitle">AI Video Portfolio by Shai Rodogovsky</p>

    <!-- Main showreel -->
    <div class="video-wrap" id="main-wrap" style="cursor:pointer;" onclick="playMain()">
      <video id="main-thumb" muted playsinline preload="metadata"
        style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;">
        <source src="https://res.cloudinary.com/dwibe3rjs/video/upload/Reel_Cut_01_rgqob6.mp4" type="video/mp4">
      </video>
      <div id="main-play" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
        width:64px;height:64px;background:rgba(0,0,0,0.6);border-radius:50%;
        display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><polygon points="6,3 20,12 6,21"/></svg>
      </div>
      <iframe id="main-iframe" style="display:none;"
        src=""
        data-src="https://player.cloudinary.com/embed/?cloud_name=dwibe3rjs&public_id=Reel_Cut_01_rgqob6&autoplay=true"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <script>
      var mainThumb = document.getElementById('main-thumb');
      mainThumb.addEventListener('loadedmetadata', function() {
        mainThumb.currentTime = 19;
      });

      function playMain() {
        var wrap = document.getElementById('main-wrap');
        var iframe = document.getElementById('main-iframe');
        var thumb = document.getElementById('main-thumb');
        var play = document.getElementById('main-play');
        iframe.src = iframe.dataset.src;
        iframe.style.display = 'block';
        thumb.style.display = 'none';
        play.style.display = 'none';
        wrap.style.cursor = 'default';
        wrap.onclick = null;
      }
    </script>

    <div class="two-col" style="margin-top: 40px;">
      <div class="video-card">
        <h3>AI ad for base 360</h3>
        <div class="video-wrap">
          <iframe
            src="https://player.cloudinary.com/embed/?cloud_name=dwibe3rjs&public_id=base360_commercial_dzjany"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <div class="video-card">
        <h3>YouTube CEO video for Crypto Banter</h3>
        <div class="video-wrap">
          <iframe
            src="https://player.cloudinary.com/embed/?cloud_name=dwibe3rjs&public_id=shai_ceo_intro_xbvf9b"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>

    <!-- Contact -->
    <a class="btn-contact" href="mailto:beyondreelai@gmail.com">Contact Us</a>

    <div class="links">
      <a href="mailto:beyondreelai@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/shai-rodogovsky-5844001a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://www.thetalentmanager.com/talent/31375/shai-rodogovsky" target="_blank" rel="noopener noreferrer">Portfolio</a>
    </div>

  </div>
</body>
</html>
